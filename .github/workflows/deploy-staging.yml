name: Deploy Lytir AI Web App [Staging]

# Staging deployments are initiated manually from GitHub Actions.
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Lint Markdown
        run: npm run lint:md

      - name: Test
        run: npm test

      - name: Verify required build configuration
        env:
          VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_MAP_STYLE_LIGHT: ${{ vars.VITE_MAP_STYLE_LIGHT }}
          VITE_MAP_STYLE_DARK: ${{ vars.VITE_MAP_STYLE_DARK }}
          VITE_API_DIAG_URL: ${{ vars.VITE_API_DIAG_URL }}
          VITE_API_EARTHQUAKES_URL: ${{ vars.VITE_API_EARTHQUAKES_URL }}
          VITE_API_AI_QA_URL: ${{ vars.VITE_API_AI_QA_URL }}
          VITE_API_ADMIN_SYNC_DATA_URL: ${{ vars.VITE_API_ADMIN_SYNC_DATA_URL }}
        run: |
          # A missing Firebase value builds an application that looks fine and
          # silently cannot sign anyone in; a missing basemap style builds one
          # whose map never appears. Fail here instead.
          missing=""
          for name in VITE_APP_VERSION VITE_FIREBASE_API_KEY \
            VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_APP_ID VITE_MAP_STYLE_LIGHT \
            VITE_MAP_STYLE_DARK VITE_API_DIAG_URL \
            VITE_API_EARTHQUAKES_URL VITE_API_AI_QA_URL \
            VITE_API_ADMIN_SYNC_DATA_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Not set for the staging environment:$missing" >&2
            echo "Add them under Environments > staging > Environment variables." >&2
            exit 1
          fi
          echo "✓ All required build configuration is present."

      - name: Build
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_MAP_STYLE_LIGHT: ${{ vars.VITE_MAP_STYLE_LIGHT }}
          VITE_MAP_STYLE_DARK: ${{ vars.VITE_MAP_STYLE_DARK }}
          VITE_API_DIAG_URL: ${{ vars.VITE_API_DIAG_URL }}
          VITE_API_EARTHQUAKES_URL: ${{ vars.VITE_API_EARTHQUAKES_URL }}
          VITE_API_AI_QA_URL: ${{ vars.VITE_API_AI_QA_URL }}
          VITE_API_ADMIN_SYNC_DATA_URL: ${{ vars.VITE_API_ADMIN_SYNC_DATA_URL }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
          production_branch: dev
